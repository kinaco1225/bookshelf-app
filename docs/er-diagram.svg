<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1300" role="img" aria-label="BookShelfデータベースのER図。全10テーブル、IE記法（クロウズフット）で1対多を表す。">
  <defs>
    <marker id="one" viewBox="0 0 16 16" refX="2" refY="8" markerWidth="16" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse">
