      <line x1="0" y1="7" x2="14" y2="12.8" stroke="#334155" stroke-width="1.6"></line>
    </marker>
  </defs>

  <rect x="0" y="0" width="1700" height="1300" fill="#FFFFFF"></rect>

  <text x="40" y="34" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#111827">BookShelf ER<tspan font-family="IPAGothic, sans-serif">図</tspan></text>

