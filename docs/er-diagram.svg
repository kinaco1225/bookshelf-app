    <polyline points="990,110 1360,110" marker-start="url(#one)" marker-end="url(#many)"></polyline>
    <polyline points="850,248 850,498" marker-start="url(#one)" marker-end="url(#many)"></polyline>
    <polyline points="700,200 370,200 370,632 340,632" marker-start="url(#one)" marker-end="url(#many)"></polyline>
    <polyline points="700,180 660,180 660,1045 700,1045" marker-start="url(#one)" marker-end="url(#many)"></polyline>
    <polyline points="700,225 380,225 380,1000 400,1000" marker-start="url(#one)" marker-end="url(#many)"></polyline>
    <polyline points="990,540 1020,540 1020,556 1050,556" marker-start="url(#one)" marker-end="url(#many)"></polyline>
    <polyline points="1360,570 1330,570 1330,556 1300,556" marker-start="url(#one)" marker-end="url(#many)"></polyline>
